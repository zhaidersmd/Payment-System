spring:
  application:
    name: payment-service

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:4000}

management:
  endpoints:
    web:
      exposure:
        include: health,info