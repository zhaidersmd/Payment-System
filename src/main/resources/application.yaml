spring:
  application:
    name: payment-service

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/paymentdb}
    username: ${DATASOURCE_USERNAME:payment_user}
    password: ${DATASOURCE_PASSWORD:payment_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect:  org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_URL:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}

server:
  port: ${SERVER_PORT:4000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always




