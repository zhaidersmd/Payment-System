spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/apiversioning
    username: payment_user
    password: payment_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:4000}

management:
  endpoints:
    web:
      exposure:
        include: health,info