#For PostgresDB container start
services:

  kafka:
    image: apache/kafka:4.0.0
    container_name: payment-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  redis:
    image: redis:7-alpine
    container_name: payment-redis
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16
    container_name: payment-postgres
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
    ports:
      - "5432:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data

  payment-service:
    build:
      context:  .
      dockerfile: Dockerfile

    image: payment-service:1.0.0
    container_name: payment-service
    ports:
      - "4000:4000"
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentdb
      DATASOURCE_USERNAME: payment_user
      DATASOURCE_PASSWORD: payment_password
      SPRING_PROFILES_ACTIVE: docker
      REDIS_URL: redis
      REDIS_PORT: 6379
      KAFKA_URL: kafka:9092
      SERVER_PORT: 4000
    depends_on:
      - postgres
      - redis
      - kafka

volumes:
  payment-postgres-data:



